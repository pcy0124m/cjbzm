name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

作业:
构建:
运行环境: ubuntu-latest
步骤:
      - name: Checkout
: actions/checkout@v4

      - 名称: 安装 JDK 17
使用: actions/setup-java@v4
使用:
          Java版本: '17'
          发行版: 'temurin'

      - 名称: 设置 Gradle
使用: gradle/gradle-build-action@v3
使用:
          gradle-version: '8.2'

      - 名称: 构建调试版APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - 名称: 上传APK
        uses: actions/upload-artifact@v4
使用:
          名称: car-float-apk
路径: app/build/outputs/apk/debug/app-debug.apk
