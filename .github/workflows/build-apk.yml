name: Build APK
on:
  workflow_dispatch: # 手动触发打包（手机点一下就能跑）
  push:
: [ main ]

作业:
构建:
运行环境: ubuntu-latest
步骤:
      - 名称: 检出代码
        使用: actions/checkout@v4

      - 名称: 安装 JDK 17
        使用: actions/setup-java@v4
使用:
          java版本: '17'
          发行版: 'temurin'

      - 名称: 设置 Gradle
        使用: gradle/gradle-build-action@v3

      - 名称: 构建调试版APK
        运行: ./gradlew assembleDebug

      - 名称: 上传APK
        使用: actions/upload-artifact@v5
使用:
          名称: car-float-apk
路径: app/build/outputs/apk/debug/app-debug.apk
